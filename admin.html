<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>palentweb · لوحة التحكم</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#08080B">
<script>try{if(localStorage.getItem('pwa-theme')==='light')document.documentElement.classList.add('light');var l=localStorage.getItem('pwa-lang');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<style>
:root{--bg:#08080B;--bg2:#0D0D12;--s1:#121218;--s2:#18181F;--s3:#202029;--t1:#EDEDF2;--t2:#A3A3B2;--t3:#6B6B7B;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.11);--ln3:rgba(255,255,255,.18);
--ac:#22D3EE;--ac2:#67E8F9;--ac3:#0891B2;--acs:rgba(34,211,238,.12);--ok:#34D399;--oks:rgba(52,211,153,.12);--wa:#F59E0B;--was:rgba(245,158,11,.12);--bad:#F43F5E;--bads:rgba(244,63,94,.12);--vio:#A78BFA;
--r1:4px;--r2:6px;--r3:8px;--ease:cubic-bezier(.2,.7,.2,1);--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--body:Inter,"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;color-scheme:dark}
html.light{--bg:#F7F7F9;--bg2:#FFFFFF;--s1:#FFFFFF;--s2:#F2F2F5;--s3:#E9E9EE;--t1:#121218;--t2:#55556A;--t3:#8A8A9A;--ln:rgba(10,10,20,.08);--ln2:rgba(10,10,20,.12);--ln3:rgba(10,10,20,.2);--ac:#0891B2;--ac2:#0E7490;--acs:rgba(8,145,178,.1);color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--t1);font:400 14px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac2)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}
@keyframes up{from{opacity:0;transform:translateY(10px);filter:blur(3px)}}
@keyframes ping{70%{box-shadow:0 0 0 6px transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r2);border:1px solid var(--ln2);background:var(--s1);color:var(--t1);font-weight:500;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--s2);border-color:var(--ln3)}.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex:none}
.btn-ac{background:var(--ac);border-color:var(--ac);color:#04121A}.btn-ac:hover{background:var(--ac2);border-color:var(--ac2)}
html.light .btn-ac{color:#fff}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.ib{width:36px;padding:0}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{height:38px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--ln2);background:var(--bg2);transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.login::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 40% at 70% 20%,rgba(34,211,238,.25),transparent 70%),radial-gradient(35% 35% at 20% 80%,rgba(37,99,235,.2),transparent 70%);filter:blur(30px)}
.login::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:56px 56px;-webkit-mask:radial-gradient(circle at 50% 45%,#000,transparent 70%);mask:radial-gradient(circle at 50% 45%,#000,transparent 70%)}
.lcard{position:relative;z-index:1;width:min(400px,100%);display:grid;gap:14px;padding:28px;border:1px solid var(--ln2);border-radius:var(--r3);background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(16px);box-shadow:0 40px 100px -40px rgba(0,0,0,.7);animation:up .6s var(--ease)}
.brand{display:flex;align-items:center;gap:10px;direction:ltr;font:500 18px/1 Inter,sans-serif;letter-spacing:-.03em}
.brand svg{width:30px;height:30px;border-radius:8px;flex:none}.brand i{font-style:normal;font-weight:300;color:var(--ac2)}
.lcard h1{margin:6px 0 0;font-size:22px;font-weight:500}
.lcard p{margin:0;color:var(--t2);font-size:13.5px}
.lcard label{display:grid;gap:6px;font-size:12.5px;color:var(--t2)}
.lcard .btn{height:42px}
.lerr{padding:10px 12px;border-radius:var(--r2);background:var(--bads);color:var(--bad);font-size:13px}
.lfoot{display:flex;justify-content:space-between;gap:8px}
/* app shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:16px 10px;background:var(--bg2);border-inline-end:1px solid var(--ln)}
.side .brand{padding:4px 8px 14px}
.nav{display:grid;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:var(--r2);background:transparent;color:var(--t2);cursor:pointer;font-size:14px;text-align:start;transition:background .15s,color .15s}
.nav button svg{width:17px;height:17px;flex:none}
.nav button:hover{background:var(--s2);color:var(--t1)}
.nav button.on{background:var(--s3);color:var(--t1)}
.nav button.on::before{content:"";position:absolute;inset-inline-start:-10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--ac)}
.badge{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ac);color:#04121A;font:600 11px/20px var(--mono);text-align:center}
.side-foot{margin-top:auto;display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--ln)}
.side-foot .row{display:flex;gap:6px}.side-foot .row .btn{flex:1}
.who{font-size:12px;color:var(--t3);padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:60px;padding:10px clamp(14px,3vw,28px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--ln)}
.top h2{margin:0;font-size:18px;font-weight:500;margin-inline-end:auto}
.live{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--r2);background:var(--oks);color:var(--ok);font-size:12.5px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2s infinite}
.seg{position:relative;display:inline-flex;padding:2px;border:1px solid var(--ln2);border-radius:var(--r2);background:var(--bg2)}
.seg button{position:relative;z-index:1;height:30px;padding:0 12px;border:0;background:transparent;color:var(--t2);font-size:13px;font-weight:500;border-radius:var(--r1);cursor:pointer;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--t1)}
.seg .ind{position:absolute;top:2px;bottom:2px;border-radius:var(--r1);background:var(--s3);border:1px solid var(--ln2);transition:left .3s var(--ease),width .3s var(--ease)}
.upd{font-size:12px;color:var(--t3);white-space:nowrap}
.spin svg{animation:spin .8s linear infinite}
.view{padding:clamp(14px,3vw,28px);display:grid;gap:16px;align-content:start;animation:up .5s var(--ease)}
/* cards */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:var(--r3);overflow:hidden}
.kpi{position:relative;display:grid;gap:4px;padding:16px;background:var(--s1);animation:up .5s var(--ease) both}
.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.12s}.kpi:nth-child(5){animation-delay:.16s}.kpi:nth-child(6){animation-delay:.2s}
.kpi small{font-size:12px;color:var(--t3)}
.kpi b{font:500 26px/1.15 var(--mono);letter-spacing:-.03em}
.kpi .d{font:500 11.5px var(--mono);display:inline-flex;align-items:center;gap:4px}
.d.up{color:var(--ok)}.d.dn{color:var(--bad)}.d.eq{color:var(--t3)}
.kpi svg.sp{position:absolute;right:14px;top:18px;width:72px;height:28px;opacity:.9}
html[dir="rtl"] .kpi svg.sp{right:auto;left:14px}
.kpi .d{font-family:var(--body)}
@media (max-width:900px){.top{gap:8px}.top .btn.ib{width:34px;height:34px}.top .btn-sm.mobile-only{height:34px}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{grid-column:span 6;border:1px solid var(--ln);border-radius:var(--r3);background:var(--s1);display:flex;flex-direction:column;min-height:0;animation:up .5s var(--ease) both}
.card.w12{grid-column:span 12}.card.w8{grid-column:span 8}.card.w4{grid-column:span 4}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--ln)}
.ch h3{margin:0;font-size:14px;font-weight:500;margin-inline-end:auto}
.ch .sub{font-size:12px;color:var(--t3)}
.cb{padding:16px}
.empty{padding:28px 16px;text-align:center;color:var(--t3);font-size:13px}
/* chart */
.chart{position:relative;height:260px}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;z-index:5;min-width:150px;padding:10px 12px;border:1px solid var(--ln2);border-radius:var(--r2);background:var(--s3);box-shadow:0 20px 40px -16px rgba(0,0,0,.6);font-size:12.5px;display:grid;gap:4px;transform:translate(-50%,-100%);white-space:nowrap}
.tip b{font-weight:500}.tip span{display:flex;align-items:center;gap:8px;justify-content:space-between}.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--t2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:3px;border-radius:2px}
/* bar lists */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13px}
.bar .n{display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .n em{font-style:normal;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;font:600 10px var(--mono);color:#fff}
.bar .v{font:500 12.5px var(--mono);color:var(--t2)}
.bar .v small{color:var(--t3);margin-inline-start:6px}
.bar .tr{grid-column:1/-1;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ac3),var(--ac));width:0;transition:width .9s var(--ease)}
html[dir="rtl"] .bar .tr i{margin-inline-start:auto;background:linear-gradient(270deg,var(--ac3),var(--ac))}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:14px}
.stack i{display:block;height:100%;transition:flex .8s var(--ease)}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}
.hours i{aspect-ratio:1/1.6;border-radius:3px;background:var(--ac);position:relative}
.hlab{display:flex;justify-content:space-between;margin-top:8px;font:400 10.5px var(--mono);color:var(--t3);direction:ltr}
/* lists */
.mini{display:grid}
.mini>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 16px;border-top:1px solid var(--ln);cursor:pointer;transition:background .15s}
.mini>div:first-child{border-top:0}
.mini>div:hover{background:var(--s2)}
.mini b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini small{color:var(--t3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r{text-align:end;display:grid;justify-items:end;gap:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r1);font-size:11.5px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-new{background:var(--acs);color:var(--ac2)}.st-contacted,.st-confirmed{background:var(--was);color:var(--wa)}.st-won,.st-done{background:var(--oks);color:var(--ok)}.st-lost,.st-cancelled{background:var(--bads);color:var(--bad)}
/* toolbar + table */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search input{width:100%;padding-inline-start:34px}
.search svg{position:absolute;inset-inline-start:10px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--t3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:32px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--ln2);background:var(--bg2);color:var(--t2);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chips button b{font:500 11px var(--mono);color:var(--t3)}
.chips button[aria-pressed="true"]{background:var(--s3);color:var(--t1);border-color:var(--ln3)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:start;font-weight:500;font-size:12px;color:var(--t3);padding:10px 12px;border-bottom:1px solid var(--ln);background:var(--bg2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--ln);vertical-align:top}
.tbl tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:var(--s2)}
.tbl tr.isnew td:first-child{box-shadow:inset 2px 0 0 var(--ac)}
html[dir="rtl"] .tbl tr.isnew td:first-child{box-shadow:inset -2px 0 0 var(--ac)}
.tbl .msg{max-width:320px;color:var(--t2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbl .tags{display:flex;flex-wrap:wrap;gap:4px;max-width:240px}
.tag{height:22px;display:inline-flex;align-items:center;padding:0 7px;border-radius:var(--r1);background:var(--s3);font-size:11.5px;color:var(--t2);white-space:nowrap}
.scroll{overflow:auto;max-height:calc(100dvh - 210px)}
.cards{display:none}
.lcard2{display:grid;gap:8px;padding:14px 16px;border-top:1px solid var(--ln);cursor:pointer}
.lcard2:first-child{border-top:0}
.lcard2 .h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.lcard2 b{font-weight:500}
.lcard2 small{color:var(--t3);font-size:12px}
.lcard2 p{margin:0;color:var(--t2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* bookings */
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px}
.day{display:grid;justify-items:center;gap:2px;padding:8px 2px;border:1px solid var(--ln);border-radius:var(--r2);background:var(--bg2);font-size:11px;color:var(--t3);cursor:pointer;transition:all .15s}
.day b{font:500 15px var(--mono);color:var(--t1)}
.day em{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--s3);font:500 10.5px/18px var(--mono);text-align:center;color:var(--t3)}
.day.has em{background:var(--ac);color:#04121A}
.day.today{border-color:var(--ac)}
.day[aria-pressed="true"]{background:var(--s3);border-color:var(--ln3)}
.bgroup h4{margin:0;padding:10px 16px;font-size:12.5px;font-weight:500;color:var(--t2);background:var(--bg2);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.bgroup:first-child h4{border-top:0}
.brow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);cursor:pointer;transition:background .15s}
.brow:hover{background:var(--s2)}
.brow .t{font:500 16px var(--mono);direction:ltr;text-align:center;padding:6px 0;border:1px solid var(--ln2);border-radius:var(--r2);background:var(--bg2)}
.brow b{font-weight:500}.brow small{display:block;color:var(--t3);font-size:12px}
.qa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;z-index:41;width:min(460px,100%);display:flex;flex-direction:column;background:var(--bg2);border-inline-start:1px solid var(--ln2);box-shadow:0 0 80px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .35s var(--ease)}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none!important}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ln)}
.dh h3{margin:0;font-size:16px;font-weight:500;margin-inline-end:auto}
.db{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.kv{display:grid;gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:var(--r2);overflow:hidden}
.kv div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--s1);font-size:13px}
.kv small{color:var(--t3)}
.kv span{word-break:break-word;white-space:pre-wrap}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--ln)}
.stsel{display:flex;gap:6px;flex-wrap:wrap}
.stsel button{border:1px solid var(--ln2);background:var(--bg2);border-radius:var(--r2);height:32px;padding:0 10px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--t2)}
.stsel button[aria-pressed="true"]{border-color:currentColor}
.stsel button.st-new[aria-pressed="true"],.stsel button.st-new:hover{color:var(--ac2)}
.toast{position:fixed;bottom:20px;left:50%;z-index:60;display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--ln2);border-radius:var(--r2);background:var(--s3);box-shadow:0 20px 40px -16px rgba(0,0,0,.6);font-size:13.5px;transform:translate(-50%,20px);opacity:0;transition:all .35s var(--ease);pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--ac)}
/* mobile */
.mtab{display:none}
.mobile-only{display:none!important}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.card.w8,.card.w4{grid-column:span 12}}
@media (max-width:900px){
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtab{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
  .mtab button{position:relative;display:grid;justify-items:center;gap:2px;height:50px;border:0;background:transparent;color:var(--t3);font-size:11px;cursor:pointer;border-radius:var(--r2)}
  .mtab button svg{width:20px;height:20px}
  .mtab button.on{color:var(--t1);background:var(--s2)}
  .mtab .badge{position:absolute;top:2px;inset-inline-end:18%;margin:0;min-width:16px;height:16px;font-size:10px;line-height:16px;padding:0 4px}
  .view{padding-bottom:90px}
  .card{grid-column:span 12!important}
  .mobile-only{display:inline-flex!important}
  .days{grid-template-columns:repeat(7,minmax(0,1fr))}
  .tbl-wrap{display:none}.cards{display:block}
}

function closeDrawer(){const d=$('#drawer'),sc=$('#scrim');if(!d.classList.contains('on'))return;d.classList.remove('on');sc.classList.remove('on');d.setAttribute('aria-hidden','true');setTimeout(()=>sc.hidden=true,250);S.open=null}
async function setStatus(kind,id,st){const r=await api(`/api/admin/${kind}/${id}`,{method:'PATCH',body:JSON.stringify({status:st})});if(!r.ok)return;
 const list=kind==='leads'?S.leads:S.bookings,x=list.find(i=>i.id===id);if(x)x.status=st;badges();render();if(S.open&&S.open.id===id)openItem(kind,id);toast(t('saved'))}
/* ---------- boot ---------- */
i18n();
fetch('/api/admin/me',{credentials:'same-origin'}).then(r=>r.ok?showApp():showLogin()).catch(showLogin);
})();
</script>
